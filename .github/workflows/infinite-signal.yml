name: Infinite Signal tests

on:
  push:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"
  pull_request:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinite-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generator and synthesis tests
        run: python -m unittest discover -s tests -v
      - name: Generate Composer sample
        run: python radio.py --mode composer --profile space --bars 4 --seed 421 --wav /tmp/infinite-signal-composer.wav
      - name: Generate Radio sample
        run: python radio.py --mode radio --sequence space,sci-fi,epic --bars 4 --seed 421 --wav /tmp/infinite-signal-radio.wav
      - name: Validate exported WAV files
        run: |
          python - <<'PY'
          import wave
          for path in ("/tmp/infinite-signal-composer.wav", "/tmp/infinite-signal-radio.wav"):
              with wave.open(path, "rb") as audio:
                  assert audio.getnchannels() == 1
                  assert audio.getsampwidth() == 2
                  assert audio.getframerate() == 22050
                  assert audio.getnframes() > 0
                  print(path, audio.getnframes(), "frames")
          PY
      - name: Upload audio samples
        uses: actions/upload-artifact@v4
        with:
          name: infinite-signal-samples
          path: |
            /tmp/infinite-signal-composer.wav
            /tmp/infinite-signal-radio.wav
          if-no-files-found: error
          retention-days: 14
