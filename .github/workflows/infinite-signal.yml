name: Infinite Signal tests

on:
  push:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"
  pull_request:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinite-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generator and synthesis tests
        run: python -m unittest discover -s tests -v
      - name: Generate Composer sample
        run: python radio.py --mode composer --profile space --bars 4 --seed 421 --wav /tmp/infinite-signal-composer.wav
      - name: Generate Radio sample
        run: python radio.py --mode radio --sequence space,sci-fi,epic --bars 4 --seed 421 --wav /tmp/infinite-signal-radio.wav
      - name: Generate v0.3.2 listening samples
        run: |
          mkdir -p /tmp/infinite-signal-listening
          python radio.py --mode composer --profile retro-arcade --bars 8 --seed 421 --bpm 140 --wav /tmp/infinite-signal-listening/retro-arcade-v032.wav
          python radio.py --mode radio --sequence retro-arcade,adventure,retro-arcade --bars 8 --seed 421 --bpm 140 --wav /tmp/infinite-signal-listening/transmission-v032.wav
      - name: Generate Space v0.3.3 phrase comparison samples
        run: |
          python radio.py --mode composer --profile space --variant wide-leap --bars 16 --seed 421 --bpm 110 --wav /tmp/infinite-signal-listening/space-wide-leap-16bars-v033.wav
          python radio.py --mode composer --profile space --variant minor-hook --bars 16 --seed 421 --bpm 110 --wav /tmp/infinite-signal-listening/space-minor-hook-16bars-v033.wav
      - name: Validate exported WAV files
        run: |
          python - <<'PY'
          import glob
          import wave
          paths = [
              "/tmp/infinite-signal-composer.wav",
              "/tmp/infinite-signal-radio.wav",
              *glob.glob("/tmp/infinite-signal-listening/*.wav"),
          ]
          assert len(paths) == 6, f"Expected 6 WAV files, found {len(paths)}"
          for path in paths:
              with wave.open(path, "rb") as audio:
                  assert audio.getnchannels() == 1
                  assert audio.getsampwidth() == 2
                  assert audio.getframerate() == 22050
                  assert audio.getnframes() > 0
                  print(path, audio.getnframes(), "frames")
          PY
      - name: Upload audio samples
        uses: actions/upload-artifact@v4
        with:
          name: infinite-signal-samples
          path: |
            /tmp/infinite-signal-composer.wav
            /tmp/infinite-signal-radio.wav
            /tmp/infinite-signal-listening/*.wav
          if-no-files-found: error
          retention-days: 14
