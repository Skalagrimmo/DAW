name: Infinite Signal tests

on:
  push:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"
  pull_request:
    paths:
      - "infinite-signal/**"
      - ".github/workflows/infinite-signal.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infinite-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generator and synthesis tests
        run: python -m unittest discover -s tests -v
      - name: Generate Composer sample
        run: python radio.py --mode composer --profile space --bars 4 --seed 421 --wav /tmp/infinite-signal-composer.wav
      - name: Generate Radio sample
        run: python radio.py --mode radio --sequence space,sci-fi,epic --bars 4 --seed 421 --wav /tmp/infinite-signal-radio.wav
      - name: Generate v0.3.2 listening samples
        run: |
          mkdir -p /tmp/infinite-signal-listening
          python radio.py --mode composer --profile retro-arcade --bars 8 --seed 421 --bpm 140 --wav /tmp/infinite-signal-listening/retro-arcade-v032.wav
          python radio.py --mode composer --profile space --bars 8 --seed 421 --bpm 110 --wav /tmp/infinite-signal-listening/space-v032.wav
          python radio.py --mode radio --sequence retro-arcade,adventure,retro-arcade --bars 8 --seed 421 --bpm 140 --wav /tmp/infinite-signal-listening/transmission-v032.wav
      - name: Generate Space profile A/B candidates
        run: |
          python - <<'PY'
          from copy import deepcopy
          from engine.generator import generate_song
          from engine.profiles import PROFILES
          from engine.wav_export import write_wav

          original = deepcopy(PROFILES["space"])
          candidates = {
              "space-melody-candidate-v033.wav": {
                  "melody_density": 0.62,
                  "arp_density": 0.24,
                  "drum_pattern": "sparse",
                  "brightness": 0.48,
              },
              "space-pulse-candidate-v033.wav": {
                  "melody_density": 0.52,
                  "arp_density": 0.36,
                  "drum_pattern": "pulse",
                  "brightness": 0.48,
              },
          }
          for filename, changes in candidates.items():
              profile = deepcopy(original)
              profile.update(changes)
              PROFILES["space"] = profile
              score = generate_song("space", bars=8, seed=421, bpm=110)
              write_wav(score, "/tmp/infinite-signal-listening/" + filename)
          PROFILES["space"] = original
          PY
      - name: Validate exported WAV files
        run: |
          python - <<'PY'
          import glob
          import wave
          paths = [
              "/tmp/infinite-signal-composer.wav",
              "/tmp/infinite-signal-radio.wav",
              *glob.glob("/tmp/infinite-signal-listening/*.wav"),
          ]
          assert len(paths) == 7, f"Expected 7 WAV files, found {len(paths)}"
          for path in paths:
              with wave.open(path, "rb") as audio:
                  assert audio.getnchannels() == 1
                  assert audio.getsampwidth() == 2
                  assert audio.getframerate() == 22050
                  assert audio.getnframes() > 0
                  print(path, audio.getnframes(), "frames")
          PY
      - name: Upload audio samples
        uses: actions/upload-artifact@v4
        with:
          name: infinite-signal-samples
          path: |
            /tmp/infinite-signal-composer.wav
            /tmp/infinite-signal-radio.wav
            /tmp/infinite-signal-listening/*.wav
          if-no-files-found: error
          retention-days: 14
